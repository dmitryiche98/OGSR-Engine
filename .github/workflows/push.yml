name: Main Workflow

on:
  push:
  pull_request:
  release:
    types:
      - created

jobs:
  build:
    if: "contains(github.event.head_commit.message, '[ci build]') || github.event_name == 'release'"
    runs-on: windows-2022  # як в upstream OGSR: на новому образі немає ATL (atlstr.h)
    strategy:
      fail-fast: false
      matrix:
        # "Загублений в Зоні": збираємо лише Release, щоб не чекати втричі довше
        Configuration: [Release]
        Platform: [x64]
        include:
          - Configuration: Release
            ConfigurationReal: Release
    steps:
    - uses: actions/checkout@v4.2.2
      with:
        fetch-depth: 0

    - name: Update DirectX Components
      run: |
        ${{ github.workspace }}/Update_Components.cmd

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    - name: MSBuild
      shell: cmd
      run: |
        set APPVEYOR_BUILD_VERSION=3.${{ github.run_number }}
        set APPVEYOR_REPO_NAME=${{ github.repository }}
        set CONFIGURATION_GA=${{ matrix.Configuration }}
        
        msbuild Engine.sln /t:Rebuild /p:Configuration=${{ matrix.ConfigurationReal }} /p:Platform=${{ matrix.Platform }} /m /flp1:errorsonly;logfile=msbuild_errors.log /flp2:warningsonly;logfile=msbuild_warnings.log /flp3:verbosity=normal;logfile=msbuild_full.log
    - name: Report build errors as annotations
      if: failure()
      shell: pwsh
      run: |
        # "Загублений в Зоні": помилки компіляції видно в анотаціях запуску (без завантаження повного логу)
        if (Test-Path msbuild_errors.log) {
          Get-Content msbuild_errors.log | Select-Object -Unique -First 40 | ForEach-Object { Write-Output ("::error::" + $_) }
        } else { Write-Output "::error::msbuild_errors.log not found" }
        if (Test-Path msbuild_full.log) {
          Select-String -Path msbuild_full.log -Pattern "is abstract|abstract class|cannot instantiate" | ForEach-Object { $_.Line.Trim() } | Where-Object { $_ -match "note|abstract" } | Select-Object -Unique -First 10 | ForEach-Object { Write-Output ("::warning::" + $_) }
        }
        Get-ChildItem -Path . -Filter *.log | ForEach-Object { Write-Output ("::warning::log file " + $_.Name + " size " + $_.Length) }
    - name: Prepare artifacts
      shell: cmd
      run: |
        set APPVEYOR_BUILD_VERSION=3.${{ github.run_number }}
        set CONFIGURATION=${{ matrix.Configuration }}
        set PLATFORM=${{ matrix.Platform }}
        set OGSR_ARTIFACT_NAME=OGSR_Engine_SHOC_EDITION_%PLATFORM%_%APPVEYOR_BUILD_VERSION%_%CONFIGURATION%.7z
        cd bin_%PLATFORM%
        
        md ..\Game\Resources_SoC_1.0006\bin_%PLATFORM%
        
        del *.ico
        
        copy *.* ..\Game\Resources_SoC_1.0006\bin_%PLATFORM%
        
        cd ..\Game\Resources_SoC_1.0006
        
        7z a -t7z -m0=LZMA2:d=96m:fb=273 -mx=9 -mmt=2 ..\..\%OGSR_ARTIFACT_NAME% .\
    - name: Upload OGSR artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        path: .\OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z

    - name: Upload release asset
      if: github.event_name == 'release'
      uses: Czuz/upload-release-asset@v1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: .\OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        asset_name: OGSR_Engine_SHOC_EDITION_${{ matrix.Platform }}_3.${{ github.run_number }}_${{ matrix.Configuration }}.7z
        asset_content_type: application/zip
